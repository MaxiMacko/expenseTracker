name: Deploy to AWS EC2

on:
  push:
    branches:
      - master  # Triggers deployment when you push to master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_TARGET_DIR }}
            
            # Stash or discard local uncommitted changes if any
            git reset --hard HEAD
            
            # Pull latest changes from master
            git pull origin master
            
            # Rebuild and restart updated containers
            docker compose up -d --build
            
            # Clean up dangling images to prevent disk fill-up
            docker image prune -f